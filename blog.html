<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" content="width=500" >

    <title>Blog | Alper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-gradient">
        <div class="bg-blob"></div>
    </div>
    <div class="bg-grid"></div>
    <canvas id="bg-canvas"></canvas>

    <!-- Navigation -->
    <nav class="navbar scrolled" id="navbar">

                <li><a href="index.html#home" class="nav-link" data-i18n="nav-home">Ana Sayfa</a></li>

            <div class="nav-extra">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">

                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
                <div class="lang-switch" id="lang-switch">
                    <button class="lang-btn active" data-lang="tr">TR</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-btn" data-lang="en">EN</button>
                </div>
                <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Blog Header -->
    <section class="page-header">
        <div class="section-container">
            <div class="section-header center">
                <span class="section-tag">Blog</span>
                <h1 class="section-title">Yazılarım <br><span class="gradient-text"></span></h1>
                <p class="section-subtitle">
                    Yazılım geliştirme, teknoloji trendleri ve deneyimlerim hakkında yazılar.
                </p>
            </div>
        </div>
    </section>

    <!-- Blog Posts -->
    <section class="blog-page">
        <div class="section-container">
            <div class="blog-grid" id="blog-grid">
                <!-- Articles will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p data-i18n="footer-rights">&copy; 2026 Alper. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Load all articles on blog page
        loadAllArticles();
    </script>

</html>
